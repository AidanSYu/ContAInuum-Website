<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#06080B" />
    <meta name="description" content="Contineon is the frontier lab turning intelligence into matter. We are building the second invention factory: industrialized invention across all matter. Atlas is the wedge." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" sizes="48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Contineon, industrializing breakthrough science</title>

    <!-- Open Graph / social unfurl (base values; per-page React meta overrides
         these once the SPA hydrates, but crawlers that don't run JS see these). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Contineon" />
    <meta property="og:title" content="Contineon, industrializing breakthrough science" />
    <meta property="og:description" content="The frontier lab turning intelligence into matter. Building the second invention factory: industrialized invention across all matter." />
    <meta property="og:image" content="/images/sr71-quote-wide.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Contineon, industrializing breakthrough science" />
    <meta name="twitter:description" content="The frontier lab turning intelligence into matter. Building the second invention factory: industrialized invention across all matter." />
    <meta name="twitter:image" content="/images/sr71-quote-wide.png" />
    <script>
      // FOUC guard: apply the saved theme before first paint.
      (function () {
        try {
          if (localStorage.getItem('contineon-theme') === 'dark') {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
