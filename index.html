<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#FBFAF8" />
    <meta name="description" content="contAInuum retrofits the lab you already run with ATLAS — an autonomous agent that plans, executes, hands work back to your scientists, and remembers every campaign it touches." />
    <title>contAInuum — the self-driving lab that remembers</title>

    <!-- Open Graph / social unfurl (base values; per-page React meta overrides
         these once the SPA hydrates, but crawlers that don't run JS see these). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="contAInuum" />
    <meta property="og:title" content="contAInuum — the self-driving lab that remembers" />
    <meta property="og:description" content="Retrofit your lab with ATLAS: an autonomous agent that plans, executes, hands off to humans, and remembers every campaign." />
    <meta property="og:image" content="/images/frontier-industrial-space.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="contAInuum — the self-driving lab that remembers" />
    <meta name="twitter:description" content="Retrofit your lab with ATLAS: an autonomous agent that plans, executes, hands off to humans, and remembers every campaign." />
    <meta name="twitter:image" content="/images/frontier-industrial-space.jpg" />
    <script>
      // FOUC guard: apply the saved theme before first paint.
      (function () {
        try {
          if (localStorage.getItem('containuum-theme') === 'dark') {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
