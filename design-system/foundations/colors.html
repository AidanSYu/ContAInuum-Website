<!-- @dsCard group="Foundations" name="Color palette" subtitle="Lab Instrument — light / Swiss" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Colors</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap');
*{box-sizing:border-box}
body{margin:0;background:#FBFAF8;color:#16191F;font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased;padding:36px}
.lab-label{font-family:'IBM Plex Mono',monospace;font-size:11px;text-transform:uppercase;letter-spacing:.22em;color:#9AA1AC;margin:0 0 22px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;max-width:860px}
.sw{border:1px solid #E6E3DD;border-radius:4px;overflow:hidden;background:#fff}
.chip{height:84px}
.meta{padding:10px 12px}
.name{font-size:13px;font-weight:600}
.hex{font-family:'IBM Plex Mono',monospace;font-size:11px;color:#586172;margin-top:2px}
.section{font-family:'Sora',sans-serif;font-weight:700;font-size:13px;margin:26px 0 12px;color:#16191F}
.section:first-of-type{margin-top:0}
</style>
</head>
<body>
<p class="lab-label">contAInuum / foundations — color</p>

<div class="section">Surfaces</div>
<div class="grid">
  <div class="sw"><div class="chip" style="background:#FBFAF8"></div><div class="meta"><div class="name">Paper</div><div class="hex">#FBFAF8</div></div></div>
  <div class="sw"><div class="chip" style="background:#FFFFFF"></div><div class="meta"><div class="name">Surface</div><div class="hex">#FFFFFF</div></div></div>
  <div class="sw"><div class="chip" style="background:#F3F2ED"></div><div class="meta"><div class="name">Panel</div><div class="hex">#F3F2ED</div></div></div>
  <div class="sw"><div class="chip" style="background:#E6E3DD"></div><div class="meta"><div class="name">Line</div><div class="hex">#E6E3DD</div></div></div>
</div>

<div class="section">Ink</div>
<div class="grid">
  <div class="sw"><div class="chip" style="background:#16191F"></div><div class="meta"><div class="name">Ink</div><div class="hex">#16191F</div></div></div>
  <div class="sw"><div class="chip" style="background:#586172"></div><div class="meta"><div class="name">Ink muted</div><div class="hex">#586172</div></div></div>
  <div class="sw"><div class="chip" style="background:#9AA1AC"></div><div class="meta"><div class="name">Ink faint</div><div class="hex">#9AA1AC</div></div></div>
  <div class="sw"><div class="chip" style="background:#FF4D2E"></div><div class="meta"><div class="name">Safety</div><div class="hex">#FF4D2E</div></div></div>
</div>
</body>
</html>
