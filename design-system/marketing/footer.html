<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Footer</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Sora:wght@700&family=Inter:wght@400;500&family=IBM+Plex+Mono:wght@500&display=swap');
*{box-sizing:border-box}
body{margin:0;background:#FBFAF8;color:#16191F;font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased;padding:28px}
.foot{border:1px solid #E6E3DD;border-radius:8px;overflow:hidden;background:#FBFAF8}
.top{display:grid;grid-template-columns:1.6fr 1fr 1fr;gap:32px;padding:34px}
.logo{font-family:'Sora',sans-serif;font-weight:700;font-size:18px}
.logo b{color:#FF4D2E}
.blurb{color:#586172;font-size:13px;line-height:1.6;margin:14px 0 16px;max-width:240px}
.est{font-family:'IBM Plex Mono',monospace;font-size:11px;text-transform:uppercase;letter-spacing:.22em;color:#9AA1AC}
h4{font-family:'IBM Plex Mono',monospace;font-size:11px;text-transform:uppercase;letter-spacing:.22em;color:#9AA1AC;margin:0 0 14px;font-weight:500}
ul{list-style:none;padding:0;margin:0}
li{margin-bottom:10px}
a{color:#586172;font-size:14px;text-decoration:none}
.bar{border-top:1px solid #E6E3DD;display:flex;justify-content:space-between;padding:16px 34px;font-family:'IBM Plex Mono',monospace;font-size:11px;text-transform:uppercase;letter-spacing:.15em;color:#9AA1AC}
</style>
</head>
<body>
<div class="foot">
  <div class="top">
    <div>
      <div class="logo">cont<b>AI</b>nuum</div>
      <p class="blurb">Autonomous laboratories for the next era of research. Run ATLAS agents on managed, secure infrastructure.</p>
      <div class="est">EST. 2026 — AUTONOMOUS LABS</div>
    </div>
    <div>
      <h4>Product</h4>
      <ul><li><a>Platform</a></li><li><a>Pricing</a></li><li><a>Start free trial</a></li></ul>
    </div>
    <div>
      <h4>Company</h4>
      <ul><li><a>Contact</a></li><li><a>Sign in</a></li></ul>
    </div>
  </div>
  <div class="bar"><span>© 2026 contAInuum</span><span>Payments secured by Stripe</span></div>
</div>
</body>
</html>
